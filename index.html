<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intonation — Advanced Pronunciation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#06091a;overflow:hidden;height:100vh;width:100vw}
#app{width:100vw;height:100vh;display:flex;flex-direction:column}
#progress{position:fixed;top:0;left:0;height:5px;background:linear-gradient(90deg,#880E4F,#F48FB1);z-index:99;transition:width .3s ease;border-radius:0 3px 3px 0}
#slides{flex:1;position:relative;overflow:hidden;min-height:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.active{display:flex}

/* NAV */
#nav{height:48px;background:#060714;display:flex;align-items:center;justify-content:center;gap:14px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.08)}
#nav button{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:13px;padding:6px 20px;border-radius:20px;cursor:pointer;transition:background .2s;font-family:inherit;letter-spacing:.3px}
#nav button:hover{background:rgba(255,255,255,.22)}
#nav button:disabled{opacity:.25;cursor:default}
#counter{color:rgba(255,255,255,.45);font-size:12px;min-width:60px;text-align:center}

/* SHARED */
.s-head{padding:12px 30px;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0;letter-spacing:.2px}
.badge{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 11px;font-size:11px;font-weight:600}
.s-body{flex:1;display:flex;padding:0 26px 12px;gap:22px;min-height:0}
.student-badge{background:#880E4F;color:#fff;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;flex-shrink:0}

/* PITCH ARROWS */
.ris{color:#2E7D32;font-weight:900;font-size:1.1em}
.fal{color:#B71C1C;font-weight:900;font-size:1.1em}
.rfal{color:#F57F17;font-weight:900;font-size:1.1em}

/* TITLE */
.title-slide{background:linear-gradient(140deg,#06091a 0%,#1a0512 55%,#06091a 100%);align-items:center;justify-content:center;text-align:center}
.title-slide h1{font-size:clamp(26px,4vw,58px);font-weight:900;color:#fff;line-height:1;letter-spacing:-2px}
.title-slide h1 em{font-style:normal;background:linear-gradient(90deg,#E91E63,#F8BBD9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title-sub{font-size:clamp(13px,1.7vw,19px);color:rgba(255,255,255,.6);margin-top:12px}
.goal-box{margin-top:22px;background:rgba(136,14,79,.12);border:1.5px solid rgba(136,14,79,.5);border-radius:16px;padding:16px 28px;display:inline-block;text-align:left}
.goal-box p{color:#F8BBD9;font-size:clamp(13px,1.5vw,17px);line-height:1.75}
.adv-badge{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 16px;font-size:clamp(11px,1.2vw,13px);color:rgba(255,255,255,.5);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}

/* WARM-UP */
.warmup-slide{background:#fff;flex-direction:column}
.warmup-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 40px;gap:14px}
.warmup-prompt{background:#FCE4EC;border-left:5px solid #880E4F;border-radius:0 14px 14px 0;padding:14px 22px;font-size:clamp(13px,1.6vw,17px);font-weight:600;color:#880E4F;max-width:820px;width:100%;line-height:1.65}
.warmup-pairs{display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%}
.warmup-pair{background:#FCE4EC;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.wp-phrase{font-size:clamp(16px,2.2vw,26px);font-weight:900;color:#222;flex:1;min-width:200px}
.wp-arrows{display:flex;gap:10px;flex-shrink:0}
.wp-opt{background:#fff;border-radius:8px;padding:6px 14px;font-size:clamp(12px,1.4vw,15px);font-weight:700;border:2px solid}
.teacher-note{background:#FCE4EC;border:1px solid rgba(136,14,79,.3);border-radius:10px;padding:10px 16px;font-size:clamp(11px,1.2vw,14px);color:#880E4F;max-width:820px;width:100%;line-height:1.6}

/* CONCEPT */
.concept-slide{background:#fff;flex-direction:column}
.concept-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 26px 14px;min-height:0;overflow:hidden}
.concept-cols{display:flex;gap:14px;flex:1;min-height:0}
.concept-col{border-radius:14px;padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:0;overflow-y:auto}
.cc-header{font-size:clamp(20px,3vw,36px);margin-bottom:4px;font-weight:900}
.cc-title{font-size:clamp(13px,1.5vw,17px);font-weight:900;margin-bottom:6px}
.cc-sub{font-size:clamp(11px,1.25vw,14px);color:#555;line-height:1.5;margin-bottom:10px}
.cc-row{display:flex;flex-direction:column;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.07);gap:3px}
.cc-when{font-size:clamp(11px,1.2vw,13px);font-weight:700;color:#333}
.cc-ex{font-size:clamp(12px,1.35vw,15px);color:#222;font-style:italic;line-height:1.5}
.cc-feel{font-size:clamp(10px,1.1vw,12px);color:#888;line-height:1.4}
.concept-rule{background:#FCE4EC;border-radius:12px;padding:10px 18px;font-size:clamp(12px,1.3vw,14px);color:#880E4F;font-weight:600;text-align:center;flex-shrink:0;line-height:1.6}

/* SAME WORD */
.word-slide{background:#fff;flex-direction:column}
.word-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 26px 14px;min-height:0;overflow:hidden}
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;overflow-y:auto}
.word-card{border-radius:14px;padding:14px 16px;border:2px solid;display:flex;flex-direction:column;gap:6px}
.wc-word{font-size:clamp(22px,3vw,36px);font-weight:900;text-align:center}
.wc-divider{height:1px;background:rgba(0,0,0,.1);margin:4px 0}
.wc-row{display:flex;flex-direction:column;gap:2px;padding:5px 0}
.wc-arrow{font-size:clamp(14px,1.7vw,20px);font-weight:700}
.wc-meaning{font-size:clamp(12px,1.4vw,15px);color:#444;line-height:1.5}
.wc-ex{font-size:clamp(10px,1.15vw,13px);color:#888;font-style:italic}
.word-note{background:#FCE4EC;border-radius:10px;padding:9px 16px;font-size:clamp(11px,1.25vw,14px);color:#880E4F;flex-shrink:0;line-height:1.6}

/* SPOT IT */
.spot-slide{background:#f8f9fa;flex-direction:column}
.spot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;overflow-y:auto}
.spot-box{background:#fff;border-radius:12px;padding:12px 16px;border:1.5px solid #e0e0e0;display:flex;flex-direction:column;gap:6px}
.spot-ctx{font-size:clamp(10px,1.1vw,12px);color:#880E4F;background:#FCE4EC;border-radius:6px;padding:4px 8px;line-height:1.5}
.spot-phrase{font-size:clamp(16px,2.1vw,24px);font-weight:900;color:#222;padding:4px 0;line-height:1.35}
.spot-q{font-size:clamp(11px,1.2vw,13px);color:#888;font-style:italic}
.spot-reveal-btn{align-self:flex-start;background:#880E4F;color:#fff;border:none;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:background .2s}
.spot-reveal-btn:hover{background:#6A0F3E}
.spot-ans{display:none;background:#FCE4EC;border-radius:8px;padding:10px 12px;flex-direction:column;gap:4px}
.spot-ans.open{display:flex}
.spot-ans-title{font-size:clamp(13px,1.4vw,16px);font-weight:700;color:#880E4F}
.spot-hint{font-size:clamp(10px,1.1vw,12px);color:#555;line-height:1.5}

/* TRY IT */
.tryit-slide{background:#f8f9fa;flex-direction:column}
.sent-list{display:flex;flex-direction:column;gap:9px;flex:1;overflow-y:auto}
.sent-card{background:#fff;border-radius:12px;padding:12px 16px;border:1.5px solid #e0e0e0;display:flex;flex-direction:column;gap:6px}
.sc-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#880E4F;opacity:.8}
.sca{font-size:clamp(14px,1.7vw,18px);color:#1a1a1a;font-weight:700;line-height:1.4}
.scb{font-size:clamp(14px,1.7vw,18px);color:#1a1a1a;font-weight:700;line-height:1.4}
.scn{font-size:clamp(10px,1.1vw,12px);color:#888;font-style:italic;line-height:1.45}
.tryit-dir{background:#FCE4EC;border-radius:10px;padding:8px 16px;font-size:clamp(12px,1.3vw,14px);color:#880E4F;font-weight:600;flex-shrink:0;line-height:1.55}

/* TAG QUESTIONS */
.tag-slide{background:#fff;flex-direction:column}
.tag-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 26px 14px;min-height:0;overflow-y:auto}
.tag-cards{display:flex;gap:14px;flex:1;min-height:0}
.tag-card{border-radius:14px;padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.tag-card-title{font-size:clamp(13px,1.5vw,17px);font-weight:900;margin-bottom:2px}
.tag-card-sub{font-size:clamp(11px,1.2vw,13px);line-height:1.55}
.tag-ex{padding:7px 10px;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.tag-phrase{font-size:clamp(13px,1.5vw,17px);font-weight:800;color:#222;line-height:1.3}
.tag-meaning{font-size:clamp(11px,1.2vw,13px);color:#555;line-height:1.45}
.tag-tip{background:#FCE4EC;border-radius:10px;padding:9px 16px;font-size:clamp(11px,1.25vw,13px);color:#880E4F;flex-shrink:0;line-height:1.6}

/* ROLE-PLAY */
.roleplay-slide{background:#1a0512;flex-direction:column}
.rp-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 26px;min-height:0;overflow:hidden}
.rp-scenario{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 18px;font-size:clamp(12px,1.3vw,14px);color:rgba(255,255,255,.75);flex-shrink:0;line-height:1.5}
.rp-cols{display:grid;grid-template-columns:3fr 2fr;gap:14px;flex:1;min-height:0;overflow:hidden}
.rp-col{background:rgba(255,255,255,.04);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.rp-col-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;flex-shrink:0;color:#F48FB1}
.rp-line{padding:5px 8px;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.rp-line.teacher{background:rgba(255,255,255,.04)}
.rp-line.student{background:rgba(136,14,79,.3);border:1px solid rgba(244,143,177,.3)}
.rp-speaker{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.5;color:#fff}
.rp-text{font-size:clamp(11px,1.35vw,14px);color:#fff;line-height:1.6}
.rp-text .ris{font-size:1em}
.rp-text .fal{font-size:1em}
.rp-tip{background:rgba(136,14,79,.2);border:1px solid rgba(244,143,177,.3);border-radius:10px;padding:8px 14px;font-size:clamp(11px,1.2vw,13px);color:#F48FB1;flex-shrink:0}
.rp-tips-list{display:flex;flex-direction:column;gap:7px;font-size:clamp(11px,1.25vw,13px);color:rgba(255,255,255,.7)}

/* QUIZ */
.quizq-slide{background:#f8f9fa;flex-direction:column}
.q-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 26px 12px;overflow-y:auto}
.q-box{background:#fff;border-radius:12px;padding:12px 16px;border:1.5px solid #e0e0e0;display:flex;flex-direction:column;gap:5px}
.q-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#880E4F;opacity:.8}
.q-text{font-size:clamp(12px,1.3vw,15px);font-weight:600;color:#222;line-height:1.45}
.q-opts{display:flex;flex-direction:column;gap:3px}
.q-opt{font-size:clamp(11px,1.15vw,13px);color:#555;padding:2px 0;line-height:1.4}
.q-reveal-btn{align-self:flex-start;background:#880E4F;color:#fff;border:none;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:2px}
.q-reveal-btn:hover{background:#6A0F3E}
.q-ans-reveal{display:none;background:#FCE4EC;border-radius:8px;padding:8px 12px;margin-top:4px}
.q-ans-reveal.open{display:block}
.qr-opts{display:flex;flex-direction:column;gap:3px;margin-bottom:5px}
.qr-opt{font-size:clamp(11px,1.15vw,13px);color:#555;padding:2px 6px;border-radius:5px}
.qr-opt.correct{background:#880E4F;color:#fff;font-weight:700}
.qr-hint{font-size:clamp(10px,1.1vw,12px);color:#880E4F;line-height:1.5}
.think-banner{background:#FCE4EC;border-radius:10px;padding:8px 16px;font-size:clamp(12px,1.3vw,14px);color:#880E4F;font-weight:600;flex-shrink:0}

/* SUMMARY */
.summary-slide{background:linear-gradient(140deg,#06091a 0%,#1a0512 55%,#06091a 100%);flex-direction:column}
.sum-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.sum-card{border-radius:16px;padding:18px 20px;min-width:150px;max-width:220px;flex:1}
.sum-card-icon{font-size:clamp(22px,3vw,36px);margin-bottom:6px}
.sum-card-title{font-size:clamp(13px,1.5vw,17px);font-weight:800;color:#fff;margin-bottom:5px;line-height:1.3}
.sum-card-body{font-size:clamp(10px,1.1vw,12px);color:rgba(255,255,255,.7);line-height:1.5}
.sum-foot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 22px;font-size:clamp(12px,1.3vw,14px);color:rgba(255,255,255,.6);text-align:center;max-width:720px}

/* FREE CONV */
.freeconv-slide{background:#1a0512;flex-direction:column}
.fc-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 40px;gap:14px}
.fc-badge{background:rgba(136,14,79,.4);border:1px solid rgba(244,143,177,.5);border-radius:20px;padding:4px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#F48FB1}
.fc-topic{font-size:clamp(22px,3.5vw,46px);font-weight:900;color:#fff;letter-spacing:-1px}
.fc-questions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:720px}
.fc-q{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 16px;font-size:clamp(13px,1.5vw,16px);color:rgba(255,255,255,.8);line-height:1.55}
.fc-note{font-size:clamp(11px,1.2vw,13px);color:rgba(255,255,255,.4);text-align:center;max-width:680px;line-height:1.6}
.fc-teacher{background:rgba(136,14,79,.15);border:1px solid rgba(244,143,177,.25);border-radius:10px;padding:10px 16px;font-size:clamp(11px,1.2vw,13px);color:#F48FB1;max-width:720px;width:100%;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="progress"></div>
  <div id="slides"></div>
  <div id="nav">
    <button id="prevBtn" onclick="move(-1)">◀ Back</button>
    <span id="counter"></span>
    <button id="nextBtn" onclick="move(1)">Next ▶</button>
  </div>
</div>
<script>
// ═══════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════

const SPOT = [
  {ctx:'🎬 You\'re asking a new classmate about their background.（新しいクラスメートに出身を聞いている）',
   phrase:'"Where did you grow up?"',
   ans:'Falling ↘ — Wh-question',
   hint:'Where / What / When / Who / Why / How で始まる疑問文は情報を求めているので語尾が下がる。答えの種類（場所・時間・人など）がすでに決まっているから、音も「確定した方向」= 下へ。"Where did you grow UP↘"（Wh疑問文 → ↘）'},
  {ctx:'🎬 Your friend just casually mentioned they quit their job. You\'re shocked.（友達が仕事を辞めたと聞いてびっくりした）',
   phrase:'"You quit?"',
   ans:'Rising ↗ — echo / surprise question',
   hint:'陳述文の形でも、語尾を上げると「え、本当に？！」という驚きの確認になる（エコー疑問文）。"You QUIT↗?" = "Wait, seriously?!" 文の形は関係なく、↗ = 「まだ信じられない・確認したい」という気持ちを表す。（陳述文 + ↗ = 驚きのエコー疑問）'},
  {ctx:'🎬 You\'re listing drink options for a guest. （お客さんに飲み物の選択肢を伝えている）',
   phrase:'"We have coffee, tea, or juice."',
   ans:'Rising ↗ ↗ then Falling ↘ — list pattern',
   hint:'リストの途中の選択肢は「まだ続きがある」から上がり、最後だけ「ここで終わり」で下がる。coffee↗, tea↗, or juice↘. この↗は「次もあるよ」というサイン。最後の↘で「以上です」を示す。（途中↗ 最後↘）'},
  {ctx:'🎬 You\'re giving a firm instruction to a child about to run into traffic.（道路に飛び出しそうな子どもに注意している）',
   phrase:'"Be careful!"',
   ans:'Falling ↘ — command',
   hint:'命令文は語尾が下がる。特に強い指示・警告のときは音がしっかり下がって「これは絶対だ」という確実さを伝える。"Be CAREful↘!" 上げてしまうと命令ではなく「お願い」や「提案」のように聞こえてしまう。（命令・指示 → ↘）'},
  {ctx:'🎬 You\'re on the phone confirming meeting time — but you\'re not 100% sure you heard correctly.（電話で待ち合わせ時間を確認中。ちゃんと聞こえたか自信がない）',
   phrase:'"So we meet at 3, right?"',
   ans:'Rising ↗ on tag — genuine question',
   hint:'タグクエスチョン（〜でしょ？）で上がる↗ = 本当に確認したい・自信がない。"So we meet at 3, RIGHT↗?" = 「3時で合ってますよね？（実はちょっと不安）」。もし確信があって念押しするだけなら↘で "...right↘?" となる。（↗タグ = 本当に聞いてる）'},
  {ctx:'🎬 You\'re starting your answer but want to add a caveat first.（答えを言う前にちょっと前置きをしたい）',
   phrase:'"Honestly, I\'m not sure."',
   ans:'Rising ↗ on "Honestly" — non-final element',
   hint:'文頭の副詞（Honestly, / Actually, / To be honest, / When I get home, など）は「まだ続きがある」から上がる。"HONestly↗, I\'m not SURE↘." 上がってから下がることで文に流れと自然なリズムが生まれる。（文頭の副詞節・副詞 → ↗）'},
];

const QUIZ = [
  {q:'"Where are you from?" — what intonation pattern?',
   opts:['a) Rising ↗ — yes/no question','b) Falling ↘ — wh-question','c) Rise-Fall ↗↘ — surprise','d) Flat — statement'],
   ans:1,
   hint:'"Where" は Wh-word → falling ↘ が正解。Wh疑問文（what/where/when/who/why/how）は答えの内容を求めているので、語尾が下がる。Yes/No question（"Are you...?"）は語尾が上がる。（Wh疑問文 → 下がる）'},
  {q:'"Sorry?" with rising intonation ↗ means:',
   opts:['a) I apologise.','b) I\'m angry at you.','c) Please say that again.','d) I know, I know.'],
   ans:2,
   hint:'"Sorry↗?" = 「え、もう一度言ってもらえますか？」 — 聞き返し。"Sorry↘." = 「ごめんなさい」 — 謝罪。同じ語でもイントネーションで全く別の意味になる。（↗=聞き返し、↘=謝罪）'},
  {q:'Tag question: "It\'s cold today, isn\'t it↗?" — what does the rising tone mean?',
   opts:['a) The speaker is certain it\'s cold.','b) The speaker is asking and is genuinely unsure.','c) The speaker is commanding you to agree.','d) The speaker is angry.'],
   ans:1,
   hint:'タグクエスチョンで上がる↗ = 本当に知りたい・確信がない。"It\'s cold today, isn\'t it↗?" = 「寒いですよね？（実は自分もよくわからない）」。下がる↘ = 「そうだよね？（同意してくれるでしょ）」という確認。（↗=本当に聞いてる、↘=同意を求めてる）'},
  {q:'Which sentence uses rising intonation to express surprise?',
   opts:['a) "What time is it?" ↘','b) "Be careful!" ↘','c) "She quit her job?" ↗','d) "I live in Tokyo." ↘'],
   ans:2,
   hint:'"She quit her job↗?" = 「え、辞めたの？！」 — 陳述文の形に語尾の上昇をつけることで「信じられない」という驚きを表す。これをエコークエスチョン（echo question）と呼ぶ。（陳述文 + ↗ = 驚きのエコー質問）'},
];

function fallingHTML(){
  const rows = [
    {when:'Statements / facts（陳述文）',ex:'"I live in <strong>To</strong>kyo. ↘"',feel:'Definite, complete（確実・完結）'},
    {when:'Wh-questions（Wh疑問文）',ex:'"<strong>What</strong> are you doing? ↘"',feel:'Clear answer expected（答えが決まってる）'},
    {when:'Commands（命令）',ex:'"Be <strong>care</strong>ful. ↘"',feel:'Direct, firm（ダイレクト・はっきり）'},
    {when:'Exclamations（感嘆）',ex:'"How <strong>a</strong>mazing! ↘"',feel:'Complete emotion（感情の完結）'},
    {when:'Tag questions — asserting（同意を求める）',ex:'"It\'s cold, <strong>isn\'t</strong> it? ↘"',feel:'"I\'m pretty sure, agree?" （そうだよね？）'},
  ];
  const html = rows.map(r=>`<div class="cc-row">
    <div class="cc-when">${r.when}</div>
    <div class="cc-ex">${r.ex} <span class="fal">↘</span></div>
    <div class="cc-feel">${r.feel}</div>
  </div>`).join('');
  return `<div class="slide concept-slide">
  <div class="s-head" style="background:#880E4F">Falling Intonation ↘ <span class="badge">Teacher · 3 min</span></div>
  <div class="concept-body">
    <div class="concept-cols">
      <div class="concept-col" style="background:#FFEBEE;border:2px solid rgba(183,28,28,.25)">
        <div class="cc-header"><span class="fal">↘</span></div>
        <div class="cc-title" style="color:#B71C1C">Falling — "I know the answer / I'm complete"</div>
        <div class="cc-sub">Pitch drops on the last stressed syllable. Sounds <strong>confident, definite, finished.</strong>（最後の強音節で音程が下がる — 自信・確定・完結の印象）</div>
        ${html}
      </div>
      <div class="concept-col" style="background:#FFF9F9;border:2px solid rgba(183,28,28,.1)">
        <div class="cc-title" style="color:#B71C1C">Pitch map — where does it drop?</div>
        <div class="cc-sub">The drop happens on the <strong>last important word</strong> (the focus word). Everything after that stays low.（最後の重要語から下がり始めて、そのまま低いまま終わる）</div>
        <div style="background:#FFEBEE;border-radius:10px;padding:14px 16px;margin-top:6px;font-size:clamp(12px,1.4vw,15px);line-height:2.2;color:#222">
          "I live in <span style="font-size:1.3em;font-weight:900">TO</span>kyo <span class="fal">↘</span>"<br>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="font-size:.85em;color:#B71C1C">▼ drops here</span><br>
          "What are you <span style="font-size:1.3em;font-weight:900">DO</span>ing <span class="fal">↘</span>"<br>
          "Be <span style="font-size:1.3em;font-weight:900">CARE</span>ful <span class="fal">↘</span>"
        </div>
        <div style="background:#FCE4EC;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:clamp(11px,1.2vw,13px);color:#880E4F;line-height:1.6">
          💡 Japanese speakers often end sentences with a flat or slightly rising tone — English falling tone may feel abrupt at first, but it sounds natural and confident to native speakers.（日本語話者は文末が平らになりがち — 英語の下降調は最初は強く感じるが、ネイティブには自然で自信ある話し方に聞こえる）
        </div>
      </div>
    </div>
    <div class="concept-rule">Key: <span class="fal">↘</span> = "I'm done / I'm sure" &nbsp;·&nbsp; Statements, Wh-questions, Commands, Exclamations, Asserting tags</div>
  </div></div>`;
}

function risingHTML(){
  const rows = [
    {when:'Yes/No questions（はい／いいえ疑問文）',ex:'"Are you <strong>rea</strong>dy? ↗"',feel:'Open, uncertain（答えが不確か）'},
    {when:'Echo / surprise questions（驚き・確認）',ex:'"She <strong>quit</strong>? ↗"',feel:'"Wait, really?!" （え、本当に？）'},
    {when:'Non-final clauses（文頭の副詞節）',ex:'"When I get <strong>home</strong> ↗, I\'ll call you ↘."',feel:'More info coming（続きがある）'},
    {when:'Lists — non-final items（リストの途中）',ex:'"coffee ↗, tea ↗, or juice ↘"',feel:'Not finished yet（まだ続く）'},
    {when:'Tag questions — genuine（本当に聞いている）',ex:'"Nice, <strong>isn\'t</strong> it? ↗"',feel:'I\'m not sure, tell me（教えてほしい）'},
  ];
  const html = rows.map(r=>`<div class="cc-row">
    <div class="cc-when">${r.when}</div>
    <div class="cc-ex">${r.ex} <span class="ris">↗</span></div>
    <div class="cc-feel">${r.feel}</div>
  </div>`).join('');
  return `<div class="slide concept-slide">
  <div class="s-head" style="background:#880E4F">Rising Intonation ↗ <span class="badge">Teacher · 3 min</span></div>
  <div class="concept-body">
    <div class="concept-cols">
      <div class="concept-col" style="background:#E8F5E9;border:2px solid rgba(46,125,50,.25)">
        <div class="cc-header"><span class="ris">↗</span></div>
        <div class="cc-title" style="color:#2E7D32">Rising — "I'm not sure / There's more"</div>
        <div class="cc-sub">Pitch rises at the end. Sounds <strong>open, questioning, incomplete, surprised.</strong>（最後に音が上がる — 開いた疑問・続きがある・驚きの印象）</div>
        ${html}
      </div>
      <div class="concept-col" style="background:#F1F8E9;border:2px solid rgba(46,125,50,.1)">
        <div class="cc-title" style="color:#2E7D32">The power of rising ↗ on statements</div>
        <div class="cc-sub">Any statement becomes a question with rising intonation. This is one of the most useful patterns.（陳述文に↗をつけるだけで質問・驚きになる — とても実用的）</div>
        <div style="background:#E8F5E9;border-radius:10px;padding:12px 16px;margin-top:6px;display:flex;flex-direction:column;gap:8px">
          <div style="font-size:clamp(12px,1.4vw,15px);line-height:1.7;color:#222">
            "You're <strong>moving</strong> to Osaka. <span class="fal">↘</span>" <span style="font-size:.85em;color:#888">— stating a fact</span><br>
            "You're <strong>moving</strong> to Osaka? <span class="ris">↗</span>" <span style="font-size:.85em;color:#2E7D32">— shocked echo question</span>
          </div>
          <div style="font-size:clamp(12px,1.4vw,15px);line-height:1.7;color:#222">
            "She <strong>passed</strong>. <span class="fal">↘</span>" <span style="font-size:.85em;color:#888">— announcement</span><br>
            "She <strong>passed</strong>? <span class="ris">↗</span>" <span style="font-size:.85em;color:#2E7D32">— "Wait, really?!"</span>
          </div>
        </div>
        <div style="background:#E8F5E9;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:clamp(11px,1.2vw,13px);color:#2E7D32;line-height:1.6">
          💡 Rising on a statement = you heard something surprising and want confirmation. Very common in natural conversation.（陳述文 + ↗ = 「本当に？」という驚きの確認。日常会話で非常によく使われる）
        </div>
      </div>
    </div>
    <div class="concept-rule">Key: <span class="ris">↗</span> = "I'm open / unsure / surprised" &nbsp;·&nbsp; Yes/No questions, Echo questions, Lists (non-final), Non-final clauses, Genuine tags</div>
  </div></div>`;
}

function sameWordHTML(){
  const cards = [
    {word:'Sorry?',
     bg:'#FCE4EC',bc:'rgba(136,14,79,.3)',wc:'#880E4F',
     r1:'<span class="ris">↗</span> Rising',r1m:'"Could you repeat that?" — asking for repetition（聞き返し）',r1e:'"Sorry? I didn\'t catch that."',
     r2:'<span class="fal">↘</span> Falling',r2m:'"I apologise." — genuine apology（謝罪）',r2e:'"I\'m so sorry for being late."'},
    {word:'Really?',
     bg:'#FFF3E0',bc:'rgba(230,81,0,.3)',wc:'#E65100',
     r1:'<span class="ris">↗</span> Rising',r1m:'"I\'m surprised / I can\'t believe it."（驚き）',r1e:'"Really?! That\'s incredible!"',
     r2:'<span class="fal">↘</span> Falling',r2m:'"I see. / Is that so." — flat acknowledgment（そうなんだ）',r2e:'"Really. Okay, noted."'},
    {word:'Right.',
     bg:'#E8EAF6',bc:'rgba(57,73,171,.3)',wc:'#3949AB',
     r1:'<span class="ris">↗</span> Rising',r1m:'"Are you sure? / I\'m checking..."（本当に？）',r1e:'"Right? That\'s what you said?"',
     r2:'<span class="fal">↘</span> Falling',r2m:'"I understand. Got it." — agreement（了解）',r2e:'"Right. Let\'s move on."'},
    {word:'Fine.',
     bg:'#E0F7FA',bc:'rgba(0,131,143,.3)',wc:'#00838F',
     r1:'<span class="ris">↗</span> Rising',r1m:'"Sure, that works!" — genuine acceptance（本当に大丈夫）',r1e:'"Fine↗, I\'d love to come."',
     r2:'<span class="fal">↘</span> Falling',r2m:'Often passive-aggressive — "It\'s NOT fine." 😬（実は怒ってる）',r2e:'"Fine↘." <em>(said coldly)</em>'},
  ];
  const html = cards.map(c=>`
    <div class="word-card" style="background:${c.bg};border-color:${c.bc}">
      <div class="wc-word" style="color:${c.wc}">${c.word}</div>
      <div class="wc-divider"></div>
      <div class="wc-row">
        <div class="wc-arrow">${c.r1}</div>
        <div class="wc-meaning">${c.r1m}</div>
        <div class="wc-ex">"${c.r1e}"</div>
      </div>
      <div class="wc-row" style="border-top:1px dashed rgba(0,0,0,.1);padding-top:6px">
        <div class="wc-arrow">${c.r2}</div>
        <div class="wc-meaning">${c.r2m}</div>
        <div class="wc-ex">"${c.r2e}"</div>
      </div>
    </div>`).join('');
  return `<div class="slide word-slide">
  <div class="s-head" style="background:#880E4F">Same Word, Different Meaning <span class="badge">Teacher · 2 min</span></div>
  <div class="word-body">
    <div class="word-grid">${html}</div>
    <div class="word-note">⚠️ Intonation changes the <strong>entire meaning</strong> — not just the nuance. Native speakers read these instantly. Getting them right is one of the fastest ways to sound more natural.（イントネーションは「ニュアンス」だけでなく「意味」そのものを変える。ネイティブはこれを瞬時に読み取る）</div>
  </div></div>`;
}

function spotHTML(){
  const boxes = SPOT.map((s,i)=>{
    const id=`spot-${i}`;
    return `<div class="spot-box">
      <div class="spot-ctx">${s.ctx}</div>
      <div class="spot-phrase">${s.phrase}</div>
      <div class="spot-q">この文脈で — Rising ↗ or Falling ↘? Why?</div>
      <button class="spot-reveal-btn" onclick="toggleAns(this,'${id}')">Reveal ▾</button>
      <div class="spot-ans" id="${id}">
        <div class="spot-ans-title">${s.ans}</div>
        <div class="spot-hint">${s.hint}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="slide spot-slide">
  <div class="s-head" style="background:#880E4F">Spot It — ↗ or ↘? <span class="badge">👀 Student · 5 min</span> <span class="student-badge">Student · 5 min</span></div>
  <div class="s-body" style="flex-direction:column">
    <div class="spot-grid">${boxes}</div>
  </div></div>`;
}

function tryit1HTML(){
  const pairs = [
    {a:'"She got the job. <span class="fal">↘</span>"',b:'"She got the job? <span class="ris">↗</span>"',n:'Same words — falling ↘ = announcement, rising ↗ = "Wait, really?!" 驚きの確認'},
    {a:'"You\'re coming. <span class="fal">↘</span>"',b:'"You\'re coming? <span class="ris">↗</span>"',n:'↘ = stating a fact / plan, ↗ = "Oh, I didn\'t know you were coming!" 驚き'},
    {a:'"It\'s enough. <span class="fal">↘</span>"',b:'"It\'s enough? <span class="ris">↗</span>"',n:'↘ = satisfied statement, ↗ = "Are you sure that\'s enough?" 疑問・心配'},
    {a:'"He left. <span class="fal">↘</span>"',b:'"He left? <span class="ris">↗</span>"',n:'↘ = reporting, ↗ = shocked echo. Notice how ↗ makes it feel urgent and unbelievable. 驚き・信じられない'},
    {a:'"That\'s your plan. <span class="fal">↘</span>"',b:'"That\'s your plan? <span class="ris">↗</span>"',n:'↗ here often sounds skeptical — "Really? THAT\'s your plan?" 懐疑的にも聞こえる'},
  ];
  const cards = pairs.map((p,i)=>`
    <div class="sent-card">
      <div class="sc-num">Pair ${i+1} — say both, feel the difference</div>
      <div class="sca">A: ${p.a}</div>
      <div class="scb">B: ${p.b}</div>
      <div class="scn">📌 ${p.n}</div>
    </div>`).join('');
  return `<div class="slide tryit-slide">
  <div class="s-head" style="background:#880E4F">Try It #1 — Same Sentence, Two Meanings <span class="badge">🗣️ Student · 5 min</span> <span class="student-badge">Student · 5 min</span></div>
  <div class="s-body" style="flex-direction:column">
    <div class="tryit-dir">Say each sentence TWICE — first with falling ↘ (statement), then with rising ↗ (echo / surprise). Feel how the meaning shifts.（同じ文を2回 — まず↘で事実として、次に↗で驚きの質問として言う）</div>
    <div class="sent-list">${cards}</div>
  </div></div>`;
}

function tryit2HTML(){
  const items = [
    {ctx:'You want your friend to try something again — encouragingly（応援・励まし）',
     a:'"Try it again! <span class="ris">↗</span>"',an:'Warm, encouraging（温かく背中を押す感じ）',
     b:'"Try it again. <span class="fal">↘</span>"',bn:'Can sound cold or stern（冷たく・厳しく聞こえることがある）'},
    {ctx:'Someone says something interesting — say "Really?"（相手の発言に反応）',

     b:'"Really. <span class="fal">↘</span>"',bn:'"Okay, noted." — flat, uninterested（へぇ、そうなんだ）'},
    {ctx:'Confirming at the end of a phone call（電話の終わりに確認）',
     a:'"So, 3 o\'clock, isn\'t it? <span class="ris">↗</span>"',an:'Genuinely checking you got it right（本当に確認している）',
     b:'"So, 3 o\'clock, isn\'t it. <span class="fal">↘</span>"',bn:'"We both know it\'s 3." — asserting（確認ではなく念押し）'},

function roleplayHTML(){
  const lines = [
    {r:'teacher',s:'Teacher',t:'Hey — did you hear about Kenji? He <span class="ris">quit</span>? <span class="ris">↗</span>'},
    {r:'student',s:'Student',t:'He <em>quit</em>? ↗ No way! When?'},
    {r:'teacher',s:'Teacher',t:'Last week. Just walked out. <span class="fal">↘</span> Nobody saw it coming. <span class="fal">↘</span>'},
    {r:'student',s:'Student',t:'That\'s... kind of amazing actually. ↗ Was he unhappy?'},
    {r:'teacher',s:'Teacher',t:'I think so. <span class="fal">↘</span> Are you happy with your job? <span class="ris">↗</span>'},
    {r:'student',s:'Student',t:'Honestly? ↗ It\'s fine. ↘ [pause] ...Well, it\'s fine. ↗ [different tone — which is true?]'},
    {r:'teacher',s:'Teacher',t:'You said that twice — and they sounded totally different. <span class="fal">↘</span>'},
    {r:'student',s:'Student',t:'Ha — yeah. The first one was the polite version. The second one was honest.'},
  ];
  const lineHTML = lines.map(l=>`
    <div class="rp-line ${l.r}">
      <div class="rp-speaker">${l.s}</div>
      <div class="rp-text">${l.t}</div>
    </div>`).join('');
  return `<div class="slide roleplay-slide">
  <div class="s-head" style="background:#880E4F">Role-Play — Intonation in Real Conversation <span class="badge">🎭 Both · 7 min</span> <span class="student-badge">Student · 7 min</span></div>
  <div class="rp-body">
    <div class="rp-scenario">📍 <strong>Scenario:</strong> Gossiping about a colleague who quit. Focus on the echo questions ↗, the tag questions, and the "fine ↗ vs fine ↘" moment.（同僚が退職したという話 — エコー疑問文、タグクエスチョン、"fine"の使い方に注目）</div>
    <div class="rp-cols">
      <div class="rp-col">
        <div class="rp-col-label">Script</div>
        ${lineHTML}
      </div>
      <div class="rp-col">
        <div class="rp-col-label">Intonation Focus</div>
        <div class="rp-tips-list">
          <div><span class="ris">↗</span> <strong>"He quit?"</strong> — echo question（驚きのエコー）</div>
          <div><span class="fal">↘</span> <strong>statements</strong> — definite, reporting facts</div>
          <div><span class="ris">↗</span> <strong>"Are you happy?"</strong> — genuine yes/no question</div>
          <div><span class="ris">↗</span> <strong>"fine ↗"</strong> vs <span class="fal">↘</span> <strong>"fine ↘"</strong> — key contrast</div>
          <div><span class="ris">↗</span> <strong>"Honestly?"</strong> — non-final clause, more coming</div>
        </div>
        <div class="rp-tip" style="margin-top:auto">💡 After the script: improvise 2–3 more lines — use at least one echo question ↗ and one asserting tag ↘.（スクリプト後: エコー疑問文↗と断定タグ↘を1つずつ使って即興で続けよう）</div>
      </div>
    </div>
  </div></div>`;
}

function quizHTML(){
  const boxes = QUIZ.map((q,i)=>{
    const id=`qz-${i}`;
    const opts=q.opts.map(o=>`<div class="q-opt">${o}</div>`).join('');
    const ropts=q.opts.map((o,j)=>`<div class="qr-opt${j===q.ans?' correct':''}">${o}</div>`).join('');
    return `<div class="q-box">
      <div class="q-num">Q${i+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-opts">${opts}</div>
      <button class="q-reveal-btn" onclick="toggleAns(this,'${id}')">Answer ▾</button>
      <div class="q-ans-reveal" id="${id}">
        <div class="qr-opts">${ropts}</div>
        <div class="qr-hint">${q.hint}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="slide quizq-slide">
  <div class="s-head" style="background:#880E4F">Quick Quiz <span class="badge">🧠 Both · 4 min</span></div>
  <div class="q-body">
    <div class="think-banner">Think first, then check.（まず考えてから答えを確認しよう）</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${boxes}</div>
  </div></div>`;
}

function summaryHTML(){
  return `<div class="slide summary-slide">
  <div class="s-head" style="background:#880E4F">Summary — Intonation <span class="badge">✅ 2 min</span></div>
  <div class="s-body" style="flex-direction:column;align-items:center;justify-content:center;gap:18px">
    <div class="sum-cards">
      <div class="sum-card" style="background:rgba(183,28,28,.45)">
        <div class="sum-card-icon"><span class="fal">↘</span></div>
        <div class="sum-card-title">Falling</div>
        <div class="sum-card-body">Statements · Wh-questions · Commands · Exclamations · Asserting tags（陳述文・Wh疑問文・命令・感嘆・同意を求めるタグ）<br><em>"I'm done / I'm sure."</em></div>
      </div>
      <div class="sum-card" style="background:rgba(46,125,50,.45)">
        <div class="sum-card-icon"><span class="ris">↗</span></div>
        <div class="sum-card-title">Rising</div>
        <div class="sum-card-body">Yes/No questions · Echo questions · Lists (non-final) · Non-final clauses · Genuine tags（はい/いいえ疑問文・驚き・リスト途中・副詞節・本当に聞くタグ）<br><em>"I'm open / there's more."</em></div>
      </div>
      <div class="sum-card" style="background:rgba(136,14,79,.45)">
        <div class="sum-card-icon">🔄</div>
        <div class="sum-card-title">Same Word</div>
        <div class="sum-card-body">Intonation changes the MEANING, not just the nuance.（イントネーションは意味そのものを変える）<br><em>Sorry↗ = pardon / Sorry↘ = apology<br>Fine↗ = genuinely ok / Fine↘ = passive angry</em></div>
      </div>
      <div class="sum-card" style="background:rgba(80,10,60,.5)">
        <div class="sum-card-icon">💡</div>
        <div class="sum-card-title">Big Idea</div>
        <div class="sum-card-body">Rising = open / uncertain / more coming.（↗ = 開いた・未確定・続きがある）<br>Falling = complete / confident / final.（↘ = 完結・確定・これで終わり）</div>
      </div>
    </div>
    <div class="sum-foot">Pitch is never random — every rise and fall sends a signal. Listen for it in movies, podcasts, and conversations.（音の上がり下がりは常に意図的なシグナル — 映画・ポッドキャスト・会話の中で意識して聞いてみよう）</div>
  </div></div>`;
}

function freeconvHTML(){
  return `<div class="slide freeconv-slide">
  <div class="s-head" style="background:#880E4F">Free Conversation <span class="badge">🗣️ Student-led · 10 min</span> <span class="student-badge">Student · 10 min</span></div>
  <div class="fc-body">
    <div class="fc-badge">Today's Topic</div>
    <div class="fc-topic">If You Could Live Anywhere</div>
    <div class="fc-questions">
      <div class="fc-q">💭 If you could live in any city or country in the world, where would it be — and why?</div>
      <div class="fc-q">💭 What's something about where you live now that you would actually miss if you moved?</div>
      <div class="fc-q">💭 Do you think where you grow up shapes your personality? How?</div>
    </div>
    <div class="fc-note">（どこに住んでみたいか — 場所・理由・地元への愛着・育った環境と個性の関係）</div>
    <div class="fc-teacher">📝 <strong>Teacher goal:</strong> Notice the student's natural intonation. When they express surprise ("Really? ↗"), curiosity ("You think so? ↗"), or certainty ("Definitely. ↘"), point out what they just did. Reinforce the link between feeling and pitch.（生徒の自然なイントネーションに注目。驚き・確信などの場面でどんな音になっているか指摘してあげよう）</div>
  </div></div>`;
}

const SLIDES_HTML = [
  titleHTML(),
  warmupHTML(),
  fallingHTML(),
  risingHTML(),
  sameWordHTML(),
  spotHTML(),
  tryit1HTML(),
  tryit2HTML(),
  roleplayHTML(),
  quizHTML(),
  summaryHTML(),
  freeconvHTML(),
];

// ═══════════════════════════════════════════
//  ENGINE
// ═══════════════════════════════════════════
let cur = 0;
const total = SLIDES_HTML.length;

function build(){
  document.getElementById('slides').innerHTML = SLIDES_HTML.join('');
}

function render(){
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===cur));
  document.getElementById('counter').textContent = `${cur+1} / ${total}`;
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===total-1;
  document.getElementById('progress').style.width = `${((cur+1)/total)*100}%`;
}

function move(d){
  const n = cur+d;
  if(n>=0 && n<total){cur=n;render();}
}

function toggleAns(btn,id){
  const el=document.getElementById(id);
  const open=el.classList.toggle('open');
  btn.textContent=open?'Hide ▴':'Reveal ▾';
  if(btn.classList.contains('q-reveal-btn')) btn.textContent=open?'Hide ▴':'Answer ▾';
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') move(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') move(-1);
});

build();
render();
</script>
</body>
</html>
